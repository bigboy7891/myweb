<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一氧化二氢 | 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            /* 渐变海洋背景，无外部图片，永久可用 */
            background: linear-gradient(180deg, #082848 0%, #104b78 50%, #18689c 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", sans-serif;
            color: #ffffff;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .name {
            font-size: 48px;
            letter-spacing: 6px;
            margin-bottom: 20px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        .desc {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        .link-group a {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.6);
            padding: 10px 26px;
            margin: 8px;
            border-radius: 999px;
            transition: 0.3s ease;
        }
        .link-group a:hover {
            background-color: rgba(255,255,255,0.2);
            border-color: #fff;
        }
        footer {
            position: absolute;
            bottom: 30px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="name">一氧化二氢</h1>
        <p class="desc">归于山海，自在奔流</p>
        <div class="link-group">
            <a href="#">博客</a>
            <a href="#">相册</a>
            <a href="#">联系方式</a>
            <a href="#">Github</a>
        </div>
    </div>
    <footer>
        © 一氧化二氢 All Rights Reserved
    </footer>
</body>
</html>
